server:
  port: 8081

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: org.h2.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 30
    url: jdbc:h2:file:./votacao-cooperado-h2-db;MODE=Oracle;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
    username: sa
    password: sa
  jpa:
    properties:
      hibernate:
        default_schema: COOP_OWNER
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      path: /h2-console
      enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: /metrics
      exposure:
        include: '*'
        exclude: metrics
  metrics:
    enabled: true
    export:
    prometheus:
      enabled: true
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted

client:
  usuario:
    url: https://user-info.herokuapp.com/users